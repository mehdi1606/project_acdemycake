# ╔══════════════════════════════════════════════════════════════════╗
# ║  SARALÖWE ACADEMY — Docker Compose (Production / Server)        ║
# ║                                                                  ║
# ║  Usage:                                                         ║
# ║    1. Edit .env.docker — set SERVER_IP and any passwords        ║
# ║    2. docker compose --env-file .env.docker up -d --build       ║
# ║                                                                  ║
# ║  Local development is UNCHANGED — use npm / Maven directly.     ║
# ╚══════════════════════════════════════════════════════════════════╝

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: academy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── LibreTranslate (self-hosted AR↔EN translation) ──────────────
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: academy-translate
    restart: unless-stopped
    # Run as root so it can write the downloaded models into the named volume
    # (a fresh Docker volume is root-owned; the default non-root user can't write to it).
    user: root
    environment:
      LT_LOAD_ONLY: "en,ar"        # only load English + Arabic models (faster start)
      LT_UPDATE_MODELS: "false"
    volumes:
      - libretranslate_models:/home/libretranslate/.local/share/argos-translate
    networks:
      - academy-net
    # Not published to the host — only the backend (same network) talks to it
    expose:
      - "5000"

  # ── Spring Boot Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./academy-backend
      dockerfile: Dockerfile
    container_name: academy-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_started
    environment:
      # Database
      DB_HOST:         db
      DB_PORT:         5432
      DB_NAME:         ${DB_NAME}
      DB_USERNAME:     ${DB_USERNAME}
      DB_PASSWORD:     ${DB_PASSWORD}

      # JWT
      JWT_SECRET:      ${JWT_SECRET}

      # CORS — allow both domains (www + non-www). saralowe.com pages load the
      # React bundle whose API URL is baked to https://www.saralowe.ma, so the
      # .com origins must be whitelisted or their API calls get CORS-blocked.
      CORS_ALLOWED_ORIGINS: https://${SERVER_IP},https://saralowe.ma,https://saralowe.com,https://www.saralowe.com

      # Frontend & file URLs (all traffic goes through Nginx on port 443)
      FRONTEND_URL:    https://${SERVER_IP}
      FILE_BASE_URL:   https://${SERVER_IP}
      FILE_UPLOAD_DIR: /app/uploads

      # PayZone (legacy)
      PAYZONE_API_URL:      https://api.payzone.ma
      PAYZONE_MERCHANT_ID:  ${PAYZONE_MERCHANT_ID}
      PAYZONE_API_KEY:      ${PAYZONE_API_KEY}
      PAYZONE_SECRET_KEY:   ${PAYZONE_SECRET_KEY}
      PAYZONE_CALLBACK_URL: https://${SERVER_IP}/api/v1/payments/webhook
      PAYZONE_RETURN_URL:   https://${SERVER_IP}/payment/callback

      # CMI Chaabi Payment
      CMI_CLIENT_ID:    ${CMI_CLIENT_ID}
      CMI_STORE_KEY:    ${CMI_STORE_KEY}
      CMI_GATEWAY_URL:  ${CMI_GATEWAY_URL}
      # Server-to-server callback — CMI posts here directly (must be public)
      CMI_CALLBACK_URL: https://${SERVER_IP}/api/v1/payments/cmi/callback
      # Browser return — CMI posts browser here, backend converts POST→GET redirect
      CMI_OK_URL:       https://${SERVER_IP}/api/v1/payments/cmi/return
      CMI_FAIL_URL:     https://${SERVER_IP}/api/v1/payments/cmi/return
      CMI_SHOP_URL:     https://${SERVER_IP}

      # Mail
      MAIL_HOST:     ${MAIL_HOST}
      MAIL_PORT:     ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      EMAIL_FROM:    ${EMAIL_FROM}

      # Mux
      MUX_TOKEN_ID:           ${MUX_TOKEN_ID}
      MUX_TOKEN_SECRET:       ${MUX_TOKEN_SECRET}
      MUX_SIGNING_KEY_ID:     ${MUX_SIGNING_KEY_ID}
      MUX_SIGNING_PRIVATE_KEY: ${MUX_SIGNING_PRIVATE_KEY}
      MUX_WEBHOOK_SECRET:     ${MUX_WEBHOOK_SECRET}

      # Admin bootstrap
      ADMIN_EMAIL:     ${ADMIN_EMAIL}
      ADMIN_PASSWORD:  ${ADMIN_PASSWORD}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}

      # Spring profile
      SPRING_PROFILES_ACTIVE: prod

      # Translation — self-hosted LibreTranslate on the internal network
      LIBRETRANSLATE_URL: http://libretranslate:5000

    volumes:
      - uploads_data:/app/uploads   # Persistent file storage
    networks:
      - academy-net
    # Backend is NOT exposed on host — only Nginx talks to it
    expose:
      - "8080"

  # ── Nginx + React Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./template
      dockerfile: Dockerfile
      args:
        # Baked into the React JS bundle at build time
        REACT_APP_API_URL:     https://${SERVER_IP}
        REACT_APP_WS_URL:      wss://${SERVER_IP}/ws
        REACT_APP_NAME:        Academy
        REACT_APP_MUX_ENV_KEY: ${REACT_APP_MUX_ENV_KEY}
    container_name: academy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Let's Encrypt ACME webroot — certbot writes challenge tokens here on
      # the host, nginx serves them. Needed for issuing/renewing without
      # stopping the container (nginx holds ports 80/443).
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - academy-net

# ── Named Volumes ───────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  libretranslate_models:
    driver: local

# ── Internal Network ────────────────────────────────────────────
networks:
  academy-net:
    driver: bridge
