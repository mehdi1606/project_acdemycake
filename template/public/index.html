<!DOCTYPE html>
<html lang="en">
  <head>
   <!-- Meta Tags -->
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- SARALÖWE experience (Desktop / Mobile), decided before the first paint so nothing flickers.
		     Kept in sync with src/experience/experience.ts. The choice lives in this browser only. -->
		<style>
		  html.exp-choose, html.exp-choose body, html.exp-stage, html.exp-stage body { background: #1d0812; }
		</style>
		<script>
		  (function () {
		    var d = document.documentElement, pref = null, embedded = false;
		    try { pref = localStorage.getItem('sl_experience'); } catch (e) {}
		    try { embedded = window.self !== window.top && window.top.location.host === location.host; } catch (e) {}
		    var s = window.screen || { width: 1280, height: 800 };
		    var shortSide = Math.min(s.width, s.height);
		    var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
		    var touch = coarse || navigator.maxTouchPoints > 1;
		    d.setAttribute('data-exp-rec', touch && shortSide < 820 ? 'mobile' : 'desktop');
		    var mode = embedded ? 'mobile' : (pref === 'desktop' || pref === 'mobile' ? pref : null);
		    if (!mode) { d.className += ' exp-choose'; return; }
		    d.className += ' exp-' + mode + (embedded ? ' exp-embedded' : '');
		    if (mode === 'desktop' && touch && shortSide < 1024) {
		      document.querySelector('meta[name=viewport]').setAttribute('content', 'width=1280');
		    }
		    if (mode === 'mobile' && !embedded && !touch && window.innerWidth > 820) d.className += ' exp-stage';
		  })();
		</script>
		<meta name="description" content="SARALÖWE Academy: couture cake design and French pâtisserie, taught online by our chefs.">
		<meta name="keywords" content="LMS template, Learning Management System, e-learning software, online course platform, student management, education portal, virtual classroom, training management system, course tracking, online education">
		<meta name="author" content="Dreams Technologies">
		<meta name="robots" content="index, follow">
		
		<title>SARALÖWE Academy | Couture Cake Design Online Learning</title>

		<!-- Favicon -->
		<link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
		<link rel="apple-touch-icon" href="assets/img/apple-icon.png">

		<!-- SARALÖWE Brand Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,500;1,700&family=Montserrat:wght@300;400;500;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
  </head>
