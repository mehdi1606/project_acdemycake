# ── HTTP (all domains) → serve ACME challenge, else redirect to HTTPS www ──
server {
    listen 80;
    server_name saralowe.ma www.saralowe.ma saralowe.com www.saralowe.com;

    # Let's Encrypt webroot challenge — certbot (on the host) writes the token
    # here, nginx (in this container) serves it. Shared via a bind mount so
    # renewals work without stopping nginx / freeing port 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://www.saralowe.ma$request_uri;
    }
}

# ── HTTPS .ma no-www → redirect to www (canonical) ─────────────
server {
    listen 443 ssl;
    server_name saralowe.ma;

    ssl_certificate     /etc/letsencrypt/live/saralowe.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saralowe.ma/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://www.saralowe.ma$request_uri;
}

# ── HTTPS .com (www + no-www) → redirect to canonical www.saralowe.ma ──
# Uses the same SAN certificate as .ma (saralowe.com / www.saralowe.com are
# added to the cert as extra names by scripts/ssl-setup.sh --expand).
server {
    listen 443 ssl;
    server_name saralowe.com www.saralowe.com;

    ssl_certificate     /etc/letsencrypt/live/saralowe.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saralowe.ma/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://www.saralowe.ma$request_uri;
}

# ── HTTPS www — main site ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.saralowe.ma;

    ssl_certificate     /etc/letsencrypt/live/saralowe.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saralowe.ma/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip compression ───────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── CMI posts back here after payment (okUrl / failUrl) ──────
    # CMI auto-submits a form POST — nginx blocks POST on static files (405).
    # We don't need the POST body (React reads sessionStorage + polls DB).
    # Convert POST → GET redirect so the React SPA can boot normally.
    location = /payment/callback {
        if ($request_method = POST) {
            return 302 /payment/callback;
        }
        try_files $uri /index.html;
    }

    # ── React SPA — serve index.html for all unknown routes ────
    # index.html must NEVER be cached — it references hashed JS/CSS bundles.
    # If the browser or CDN caches it, users see the old app after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── API proxy → Spring Boot backend (internal Docker DNS) ──
    location ^~ /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 100M;
    }

    # ── File serving proxy → Spring Boot backend ───────────────
    # ^~ prevents the static-asset regex below from matching /files/*.jpg etc.
    location ^~ /files/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    # ── WebSocket proxy → Spring Boot backend ──────────────────
    location /ws/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Security headers ───────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Cache static assets ────────────────────────────────────
    # NOTE: webp/avif were previously missing here → badge images fell through to
    # the SPA `location /` rule and were served with `no-store`, forcing a fresh
    # download on every navigation. Including them lets the browser cache badges
    # for a year (they are content-stable; bust by renaming if ever changed).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
